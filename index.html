<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Time & Weather</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px;
            transition: background 2s ease;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .card {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        h2 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        #date {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        #time {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .weather-main {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }

        #weather-icon {
            font-size: 3rem;
        }

        #temperature {
            font-size: 2.5rem;
            font-weight: 300;
        }

        #weather-description {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        #weather-location,
        #weather-details {
            font-size: 0.9rem;
            opacity: 0.75;
        }

        .error {
            color: #ffd1d1;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Date &amp; Time</h2>
            <div id="date">Loading...</div>
            <div id="time">--:--:--</div>
        </div>
        <div class="card">
            <h2>Current Weather</h2>
            <div id="weather">
                <div id="weather-description">Requesting location...</div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
